<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian Terminal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 23 L12 13 L17 19 L26 8' stroke='%23ffa028' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◢</span> MERIDIAN</div>
    <div class="cmdwrap">
      <span id="target" class="target">PANEL 1</span>
      <input id="cmd" class="cmd" autocomplete="off" spellcheck="false" placeholder="Ticker or function · HELP" aria-label="Command line">
      <ul id="suggest" class="suggest" hidden></ul>
    </div>
    <div id="status" class="status"></div>
  </header>
  <div class="tape" aria-label="Ticker tape"><div id="tape-inner" class="tape-inner"></div></div>
  <main id="grid" class="grid" data-layout="4"></main>
  <footer class="footbar">
    <span id="disclaimer"></span>
    <span id="boot" class="dim"></span>
    <span><kbd>HELP</kbd> functions · <kbd>/</kbd> command line · <kbd>Ctrl</kbd>+<kbd>1-4</kbd> panels</span>
  </footer>
  <div id="boot-screen" class="boot-screen"><div><div class="brand">◢ MERIDIAN</div><p id="boot-msg">Starting…</p></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="story" class="modal" hidden>
    <div class="story" role="dialog" aria-modal="true" aria-label="News story">
      <button class="close" aria-label="Close">✕</button>
      <div class="story-body"></div>
    </div>
  </div>
</body>
</html>
